<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0614" />
<title>Shivani &amp; Akash — Neon Sangeet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Orbitron:wght@500;800&family=Space+Grotesk:wght@300;400;500;700&family=Tiro+Devanagari+Marathi&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared/core.css?v=8" />
<link rel="stylesheet" href="style.css?v=8" />
<script defer src="shared/content.js?v=8"></script>
<script defer src="shared/core.js?v=8"></script>
<script defer src="app.js?v=8"></script>
</head>
<body class="locked">

<!-- gate: power on the sign -->
<div class="gate" data-gate>
  <div class="g-grid"></div>
  <div class="g-in">
    <p class="g-s" data-i="invited"></p>
    <h1 class="g-neon"><span>Shivani</span><b>&amp;</b><span>Akash</span></h1>
    <p class="g-s">SANGEET NIGHT · <span data-i="date"></span></p>
    <button class="g-play" data-open type="button" aria-label="Open invitation"><i>▶</i></button>
    <p class="g-s blink" data-i="open"></p>
  </div>
</div>

<header class="top"><span class="fm">S&amp;A <b>FM</b> 12.12</span><div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><button class="lang" data-lang-toggle type="button"><span data-lang-label></span></button></header>

<main>
  <!-- TRACK 01 : intro -->
  <section class="hero" id="home" data-track="01 · SHIVANI & AKASH">
    <div class="sun" aria-hidden="true"></div>
    <div class="floor" aria-hidden="true"></div>
    <div class="hero-in">
      <p class="s-small rv" data-i="blessings"></p>
      <h2 class="sign rv"><span>Shivani</span><em>&amp;</em><span>Akash</span></h2>
      <p class="rv tag" data-i="tagline"></p>
      <p class="rv ddate"><span data-i="date"></span> · <span data-i="city"></span></p>
    </div>
  </section>

  <!-- TRACK 02 : countdown -->
  <section class="led-sec" id="count" data-track="02 · COUNTDOWN">
    <p class="s-small rv" data-i="countdown"></p>
    <div class="leds rv">
      <div class="led"><b data-cd="days">000</b><small data-i="days"></small></div><span>:</span>
      <div class="led"><b data-cd="hours">00</b><small data-i="hours"></small></div><span>:</span>
      <div class="led"><b data-cd="minutes">00</b><small data-i="minutes"></small></div><span>:</span>
      <div class="led"><b data-cd="seconds">00</b><small data-i="seconds"></small></div>
    </div>
    <p class="lead rv" data-i="intro"></p>
    <div class="btns rv"><button class="neon" data-action="calendar" type="button">＋ <span data-i="calendar"></span></button><button class="neon alt" data-action="copy" type="button">⌖ <span data-i="copy"></span></button></div>
  </section>

  <!-- TRACK 03 : playlist -->
  <section class="list" id="events" data-track="03 · THE PLAYLIST">
    <h2 class="h rv" data-i="events_h"></h2>
    <div class="tracks" id="tracks">
      <article class="trk rv">
        <button class="row" type="button"><span class="no">01</span><span class="cov c1">🌼</span><span class="ti"><b data-i="haldi_name"></b><small data-i="haldi_date"></small></span><span class="tm" data-i="day1"></span><span class="pb">▶</span></button>
        <div class="more"><div><p class="when" data-i="haldi_time"></p><p class="venue" data-i="haldi_venue"></p><p class="addr" data-i="haldi_addr" data-html></p><p class="note" data-i="haldi_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Kothrud+Pune"><span data-i="directions"></span> ↗</a></div></div>
      </article>
      <article class="trk rv">
        <button class="row" type="button"><span class="no">02</span><span class="cov c2">💍</span><span class="ti"><b data-i="wed_name"></b><small data-i="wed_date"></small></span><span class="tm" data-i="day2"></span><span class="pb">▶</span></button>
        <div class="more"><div><p class="when" data-i="wed_time"></p><p class="venue" data-i="wed_venue"></p><p class="addr" data-i="wed_addr" data-html></p><p class="note" data-i="wed_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="directions"></span> ↗</a></div></div>
      </article>
      <article class="trk rv">
        <button class="row" type="button"><span class="no">03</span><span class="cov c3">🪩</span><span class="ti"><b data-i="rec_name"></b><small data-i="rec_date"></small></span><span class="tm" data-i="evening"></span><span class="pb">▶</span></button>
        <div class="more"><div><p class="when" data-i="rec_time"></p><p class="venue" data-i="rec_venue"></p><p class="addr" data-i="rec_addr" data-html></p><p class="note" data-i="rec_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="directions"></span> ↗</a></div></div>
      </article>
    </div>
  </section>

  <!-- TRACK 04 : vinyls -->
  <section class="vinyls" id="couple" data-track="04 · THE DUET">
    <h2 class="h rv" data-i="couple_h"></h2>
    <div class="deck">
      <figure class="vinyl rv" data-lightbox="c" data-img="media/bride.jpg" data-name="Shivani" data-role="bride_role" data-bio="bride_bio"><div class="disc"><img src="media/bride.jpg" alt="Shivani" /></div><figcaption><b>Shivani</b><small data-i="bride_role"></small></figcaption></figure>
      <figure class="vinyl rv" data-lightbox="c" data-img="media/groom.jpg" data-name="Akash" data-role="groom_role" data-bio="groom_bio"><div class="disc"><img src="media/groom.jpg" alt="Akash" /></div><figcaption><b>Akash</b><small data-i="groom_role"></small></figcaption></figure>
    </div>
  </section>

  <!-- TRACK 05 : music video on a CRT -->
  <section class="crt-sec" id="story" data-track="05 · MUSIC VIDEO">
    <div class="crt rv" data-hovervideo tabindex="0">
      <video muted loop playsinline preload="auto" src="media/dummy.mp4"></video>
      <div class="scan"></div><div class="crt-ov"><b>▶ PLAY</b><small data-i="hover"></small></div><span class="osd">CH 12</span>
    </div>
    <h2 class="h rv" data-i="story_h"></h2><p class="lead rv" data-i="story_p"></p>
  </section>

  <!-- TRACK 06 : album covers -->
  <section class="albums" id="moments" data-track="06 · ALBUM ART">
    <h2 class="h rv" data-i="gallery_h"></h2>
    <div class="cov-grid">
      <figure class="alb" data-lightbox="c" data-img="media/bride.jpg" data-name="Shivani" data-role="bride_role" data-bio="bride_bio"><img src="media/bride.jpg" alt="" loading="lazy" /><figcaption data-i="m1"></figcaption></figure>
      <figure class="alb a1"><span>☕</span><figcaption data-i="m3"></figcaption></figure>
      <figure class="alb a2"><span>💍</span><figcaption data-i="m4"></figcaption></figure>
      <figure class="alb" data-lightbox="c" data-img="media/groom.jpg" data-name="Akash" data-role="groom_role" data-bio="groom_bio"><img src="media/groom.jpg" alt="" loading="lazy" /><figcaption data-i="m2"></figcaption></figure>
      <figure class="alb a3"><span>✈️</span><figcaption data-i="m5"></figcaption></figure>
      <figure class="alb a4"><span>💞</span><figcaption data-i="m6"></figcaption></figure>
    </div>
  </section>

  <!-- TRACK 07 : venue -->
  <section class="tour" id="venue" data-track="07 · THE VENUE">
    <h2 class="h rv" data-i="venue_h"></h2>
    <div class="tour-grid">
      <div class="nmap rv"><iframe title="Venue map" loading="lazy" src="https://maps.google.com/maps?q=Koregaon+Park+Pune&amp;output=embed"></iframe></div>
      <div class="tour-txt rv"><p class="venue" data-i="wed_venue"></p><p class="addr" data-i="wed_addr" data-html></p><ul><li>✈ <span data-i="airport"></span></li><li>🚆 <span data-i="train"></span></li><li>🚗 <span data-i="parking"></span></li></ul><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="openmap"></span> ↗</a></div>
    </div>
    <footer class="encore rv"><p data-i="closing"></p><h2>Shivani <i>&amp;</i> Akash</h2><button class="neon" id="encore" type="button">★ ENCORE ★</button><small data-i="footer"></small></footer>
  </section>
</main>

<!-- now-playing bar -->
<div class="player" aria-live="polite">
  <button class="pbtn" id="pp" type="button" aria-label="Previous">⏮</button>
  <div class="np"><small>NOW PLAYING</small><b id="npName">01 · SHIVANI &amp; AKASH</b><div class="prog"><i id="progBar"></i></div></div>
  <button class="pbtn" id="nx" type="button" aria-label="Next">⏭</button>
</div>
<a class="back-hub" href="../index.html" data-i="back"></a>
</body>
</html>

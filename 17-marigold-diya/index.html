<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#3a120c" />
<meta name="description" content="You are warmly invited to the wedding of Shivani & Akash — 12 December 2026, Pune." />
<meta property="og:title" content="Shivani & Akash — Wedding Invitation" />
<meta property="og:description" content="You are warmly invited. 12 December 2026, Pune." />
<meta property="og:image" content="https://omkarb31.github.io/Shivani-Akash-Wedding_Invitation/17-marigold-diya/media/bride.jpg" />
<title>Shivani &amp; Akash — Marigold &amp; Diya</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Mukta:wght@300;400;600&family=Tiro+Devanagari+Marathi&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared/core.css?v=9" />
<link rel="stylesheet" href="style.css?v=9" />
<script defer src="shared/content.js?v=9"></script>
<script defer src="shared/core.js?v=9"></script>
<script defer src="app.js?v=9"></script>
</head>
<body class="locked">

<!-- gate: light the diya -->
<div class="gate" data-gate>
  <div class="light" aria-hidden="true"></div>
  <div class="g-in">
    <p class="g-s" data-i="ganesh"></p>
    <h1 class="g-n">Shivani <span>&amp;</span> Akash</h1>
    <button class="diya-btn" data-open type="button" aria-label="Light the diya">
      <span class="flame"></span><span class="bowl"></span><span class="oil"></span>
    </button>
    <p class="g-s tap" data-i="open"></p>
  </div>
</div>

<!-- marigold toran (hanging garland) -->
<div class="toran" aria-hidden="true"><div class="gar g1"></div><div class="gar g2"></div></div>
<header class="top"><span class="mono">S ✿ A</span><button class="lang" data-lang-toggle type="button"><span data-lang-label></span></button></header>
<button class="fab" data-action="share" type="button" aria-label="Share"><span>↗</span></button>

<main>
  <section class="hero">
    <p class="small rv" data-i="ganesh"></p>
    <p class="warm rv" data-i="together"></p>
    <h1 class="names rv"><span>Shivani</span><em>✿</em><span>Akash</span></h1>
    <p class="tag rv" data-i="tagline"></p>
    <p class="dd rv"><span data-i="date"></span> · <span data-i="city"></span></p>
    <div class="cd rv"><div><b data-cd="days">000</b><small data-i="days"></small></div><div><b data-cd="hours">00</b><small data-i="hours"></small></div><div><b data-cd="minutes">00</b><small data-i="minutes"></small></div><div><b data-cd="seconds">00</b><small data-i="seconds"></small></div></div>
  </section>

  <section class="sec">
    <p class="small rv" data-i="fam_h"></p>
    <div class="fam rv"><div><small data-i="fam_bride"></small><b data-i="fam_bride_n"></b></div><span>🪔</span><div><small data-i="fam_groom"></small><b data-i="fam_groom_n"></b></div></div>
    <p class="lead rv" data-i="intro"></p>
  </section>

  <section class="sec events">
    <h2 class="h rv" data-i="events_h"></h2>
    <div class="arches">
      <article class="ar rv"><div class="cusp"><span>🌼</span></div><small data-i="day1"></small><h3 data-i="haldi_name"></h3><p class="when" data-i="haldi_date"></p><p data-i="haldi_time"></p><hr><p class="venue" data-i="haldi_venue"></p><p class="addr" data-i="haldi_addr" data-html></p><p class="note" data-i="haldi_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Kothrud+Pune"><span data-i="directions"></span> ↗</a></article>
      <article class="ar rv"><div class="cusp"><span>🪔</span></div><small data-i="day2"></small><h3 data-i="wed_name"></h3><p class="when" data-i="wed_date"></p><p data-i="wed_time"></p><hr><p class="venue" data-i="wed_venue"></p><p class="addr" data-i="wed_addr" data-html></p><p class="note" data-i="wed_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="directions"></span> ↗</a></article>
      <article class="ar rv"><div class="cusp"><span>🎆</span></div><small data-i="evening"></small><h3 data-i="rec_name"></h3><p class="when" data-i="rec_date"></p><p data-i="rec_time"></p><hr><p class="venue" data-i="rec_venue"></p><p class="addr" data-i="rec_addr" data-html></p><p class="note" data-i="rec_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="directions"></span> ↗</a></article>
    </div>
    <div class="btns rv"><button class="gold" data-action="calendar" type="button">＋ <span data-i="calendar"></span></button></div>
  </section>

  <!-- hanging frames -->
  <section class="sec couple">
    <h2 class="h rv" data-i="couple_h"></h2>
    <div class="hang">
      <figure class="fr rv" data-lightbox="c" data-img="media/bride.jpg" data-name="Shivani" data-role="bride_role" data-bio="bride_bio"><i class="str"></i><div class="pic"><img src="media/bride.jpg" alt="Shivani" loading="lazy" /></div><figcaption><b>Shivani</b><small data-i="bride_role"></small><p data-i="bride_bio"></p></figcaption></figure>
      <figure class="fr rv" data-lightbox="c" data-img="media/groom.jpg" data-name="Akash" data-role="groom_role" data-bio="groom_bio"><i class="str"></i><div class="pic"><img src="media/groom.jpg" alt="Akash" loading="lazy" /></div><figcaption><b>Akash</b><small data-i="groom_role"></small><p data-i="groom_bio"></p></figcaption></figure>
    </div>
  </section>

  <section class="sec story">
    <div class="film rv" data-hovervideo tabindex="0"><video muted loop playsinline preload="auto" src="media/dummy.mp4"></video><div class="v-ov"><span>▶</span><small data-i="hover"></small></div></div>
    <h2 class="h rv" data-i="story_h"></h2><p class="lead rv" data-i="story_p"></p>
  </section>

  <section class="sec moments">
    <h2 class="h rv" data-i="gallery_h"></h2>
    <div class="mg">
      <figure class="rv" data-lightbox="c" data-img="media/bride.jpg" data-name="Shivani" data-role="bride_role" data-bio="bride_bio"><img src="media/bride.jpg" alt="" loading="lazy" /><figcaption data-i="m1"></figcaption></figure>
      <figure class="rv t1"><span>☕</span><figcaption data-i="m3"></figcaption></figure>
      <figure class="rv t2"><span>💍</span><figcaption data-i="m4"></figcaption></figure>
      <figure class="rv" data-lightbox="c" data-img="media/groom.jpg" data-name="Akash" data-role="groom_role" data-bio="groom_bio"><img src="media/groom.jpg" alt="" loading="lazy" /><figcaption data-i="m2"></figcaption></figure>
    </div>
  </section>

  <section class="sec place">
    <h2 class="h rv" data-i="venue_h"></h2>
    <div class="map rv"><iframe title="Venue map" loading="lazy" src="https://maps.google.com/maps?q=Koregaon+Park+Pune&amp;output=embed"></iframe></div>
    <p class="venue-n rv" data-i="wed_venue"></p><p class="addr rv" data-i="wed_addr" data-html></p>
    <ul class="rv"><li>✈ <span data-i="airport"></span></li><li>🚆 <span data-i="train"></span></li><li>🚗 <span data-i="parking"></span></li></ul>
    <div class="btns rv"><a class="gold" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="openmap"></span> ↗</a><button class="out" data-action="copy" type="button">⌖ <span data-i="copy"></span></button></div>
  </section>

  <section class="sec rsvp">
    <p class="closing rv" data-i="withlove"></p><h2 class="sig rv">Shivani <i>✿</i> Akash</h2><small class="foot" data-i="footer"></small>
  </section>
</main>

<!-- row of diyas along the bottom -->
<div class="diyas" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<a class="back-hub" href="../index.html" data-i="back"></a>
</body>
</html>

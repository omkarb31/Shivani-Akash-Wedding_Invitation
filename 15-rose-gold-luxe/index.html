<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#faf3ee" />
<meta name="description" content="You are warmly invited to the wedding of Shivani & Akash — 12 December 2026, Pune." />
<meta property="og:title" content="Shivani & Akash — Wedding Invitation" />
<meta property="og:description" content="You are warmly invited. 12 December 2026, Pune." />
<meta property="og:image" content="https://omkarb31.github.io/Shivani-Akash-Wedding_Invitation/15-rose-gold-luxe/media/bride.jpg" />
<title>Shivani &amp; Akash — Rose Gold</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Montserrat:wght@200;300;400;500&family=Tiro+Devanagari+Marathi&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared/core.css?v=9" />
<link rel="stylesheet" href="style.css?v=9" />
<script defer src="shared/content.js?v=9"></script>
<script defer src="shared/core.js?v=9"></script>
<script defer src="app.js?v=9"></script>
</head>
<body class="locked">

<!-- gate: monogram ring draws itself -->
<div class="gate" data-gate>
  <svg class="ring" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="92"/><circle class="r2" cx="100" cy="100" r="84"/></svg>
  <div class="g-in">
    <span class="mono">S<i>&amp;</i>A</span>
    <p class="g-s" data-i="together"></p>
    <h1 class="g-n">Shivani &amp; Akash</h1>
    <p class="g-s" data-i="date"></p>
    <button class="g-btn" data-open type="button"><span data-i="open"></span></button>
  </div>
</div>

<header class="top"><span class="logo">S<i>&amp;</i>A</span><nav><a href="#home" data-i="nav_home"></a><a href="#story" data-i="nav_story"></a><a href="#events" data-i="nav_events"></a><a href="#couple" data-i="nav_couple"></a><a href="#venue" data-i="nav_venue"></a></nav><button class="lang" data-lang-toggle type="button"><span data-lang-label></span></button></header>
<button class="fab" data-action="share" type="button" aria-label="Share"><span>↗</span></button>

<main>
  <!-- split hero -->
  <section class="hero" id="home">
    <div class="half l"><img src="media/bride.jpg" alt="Shivani" /></div>
    <div class="half r"><img src="media/groom.jpg" alt="Akash" /></div>
    <div class="veil"></div>
    <div class="frame"><i></i><i></i><i></i><i></i></div>
    <div class="h-in">
      <p class="small rv" data-i="together"></p>
      <h1 class="names rv">Shivani<em>&amp;</em>Akash</h1>
      <p class="warm rv" data-i="tagline"></p>
      <p class="dd rv"><span data-i="date"></span> · <span data-i="city"></span></p>
    </div>
    <span class="cue" aria-hidden="true">⌄</span>
  </section>

  <!-- countdown -->
  <section class="count">
    <p class="small rv" data-i="countdown"></p>
    <div class="cd rv"><div><b data-cd="days">000</b><small data-i="days"></small></div><i></i><div><b data-cd="hours">00</b><small data-i="hours"></small></div><i></i><div><b data-cd="minutes">00</b><small data-i="minutes"></small></div><i></i><div><b data-cd="seconds">00</b><small data-i="seconds"></small></div></div>
    <p class="lead rv" data-i="intro"></p>
  </section>

  <!-- story: full-bleed video -->
  <section class="story" id="story" data-hovervideo tabindex="0">
    <video muted loop playsinline preload="auto" src="media/dummy.mp4"></video>
    <div class="sh"></div>
    <div class="st-in rv">
      <span class="play">▶</span>
      <h2 data-i="story_h"></h2>
      <p data-i="story_p"></p>
      <small data-i="hover"></small>
    </div>
  </section>

  <!-- events -->
  <section class="events" id="events">
    <h2 class="h rv" data-i="events_h"></h2>
    <div class="cols">
      <article class="ec rv"><span class="no">01</span><small data-i="day1"></small><h3 data-i="haldi_name"></h3><p class="when" data-i="haldi_date"></p><p data-i="haldi_time"></p><hr><p class="venue" data-i="haldi_venue"></p><p class="addr" data-i="haldi_addr" data-html></p><p class="note" data-i="haldi_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Kothrud+Pune"><span data-i="directions"></span> ↗</a></article>
      <article class="ec rv"><span class="no">02</span><small data-i="day2"></small><h3 data-i="wed_name"></h3><p class="when" data-i="wed_date"></p><p data-i="wed_time"></p><hr><p class="venue" data-i="wed_venue"></p><p class="addr" data-i="wed_addr" data-html></p><p class="note" data-i="wed_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="directions"></span> ↗</a></article>
      <article class="ec rv"><span class="no">03</span><small data-i="evening"></small><h3 data-i="rec_name"></h3><p class="when" data-i="rec_date"></p><p data-i="rec_time"></p><hr><p class="venue" data-i="rec_venue"></p><p class="addr" data-i="rec_addr" data-html></p><p class="note" data-i="rec_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="directions"></span> ↗</a></article>
    </div>
    <div class="btns rv"><button class="line" data-action="calendar" type="button">＋ <span data-i="calendar"></span></button></div>
  </section>

  <!-- couple: pull quotes -->
  <section class="couple" id="couple">
    <div class="cp rv" data-lightbox="c" data-img="media/bride.jpg" data-name="Shivani" data-role="bride_role" data-bio="bride_bio"><div class="ph"><img src="media/bride.jpg" alt="Shivani" loading="lazy" /></div><div class="tx"><small data-i="bride_role"></small><h3>Shivani</h3><blockquote data-i="bride_bio"></blockquote></div></div>
    <div class="cp rev rv" data-lightbox="c" data-img="media/groom.jpg" data-name="Akash" data-role="groom_role" data-bio="groom_bio"><div class="ph"><img src="media/groom.jpg" alt="Akash" loading="lazy" /></div><div class="tx"><small data-i="groom_role"></small><h3>Akash</h3><blockquote data-i="groom_bio"></blockquote></div></div>
  </section>

  <!-- moments: snap strip -->
  <section class="moments">
    <h2 class="h rv" data-i="gallery_h"></h2>
    <div class="strip">
      <figure data-lightbox="c" data-img="media/bride.jpg" data-name="Shivani" data-role="bride_role" data-bio="bride_bio"><img src="media/bride.jpg" alt="" loading="lazy" /><figcaption data-i="m1"></figcaption></figure>
      <figure class="g1"><span>☕</span><figcaption data-i="m3"></figcaption></figure>
      <figure class="g2"><span>💍</span><figcaption data-i="m4"></figcaption></figure>
      <figure data-lightbox="c" data-img="media/groom.jpg" data-name="Akash" data-role="groom_role" data-bio="groom_bio"><img src="media/groom.jpg" alt="" loading="lazy" /><figcaption data-i="m2"></figcaption></figure>
      <figure class="g3"><span>✈️</span><figcaption data-i="m5"></figcaption></figure>
      <figure class="g4"><span>💞</span><figcaption data-i="m6"></figcaption></figure>
    </div>
  </section>

  <!-- venue split -->
  <section class="place" id="venue">
    <div class="vmap"><iframe title="Venue map" loading="lazy" src="https://maps.google.com/maps?q=Koregaon+Park+Pune&amp;output=embed"></iframe></div>
    <div class="vtx rv"><h2 class="h left" data-i="venue_h"></h2><p class="venue-n" data-i="wed_venue"></p><p class="addr" data-i="wed_addr" data-html></p><ul><li>✈ <span data-i="airport"></span></li><li>🚆 <span data-i="train"></span></li><li>🚗 <span data-i="parking"></span></li></ul><div class="btns left"><a class="line" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="openmap"></span> ↗</a><button class="line" data-action="copy" type="button">⌖ <span data-i="copy"></span></button></div></div>
  </section>

  <!-- rsvp -->
  <section class="rsvp">
    <span class="mono2">S<i>&amp;</i>A</span>
    <p class="closing rv" data-i="withlove"></p><h2 class="sig rv">Shivani &amp; Akash</h2><small class="foot" data-i="footer"></small>
  </section>
</main>
<a class="back-hub" href="../index.html" data-i="back"></a>
</body>
</html>

<body class="locked">
<div class="wash" aria-hidden="true"><i class="w1"></i><i class="w2"></i><i class="w3"></i><i class="w4"></i></div>

<!-- gate: floral wreath -->
<div class="gate" data-gate>
  <div class="wreath"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

    <p class="g-s" data-i="together"></p>

  </div>
</div>

<header class="top"><span class="mono">S <i>&amp;</i> A</span><button class="lang" data-lang-toggle type="button"><span data-lang-label></span></button></header>
<button class="fab" data-action="share" type="button" aria-label="Share"><span>↗</span></button>

<main>
  <!-- card 1 -->
  <section class="card hero">
    <i class="corner tl"></i><i class="corner br"></i>
    <p class="small rv" data-i="together"></p>
    <h1 class="names rv"><span>Shivani</span><em>&amp;</em><span>Akash</span></h1>
    <p class="warm rv" data-i="warm"></p>
    <div class="date-line rv"><span>11</span><i></i><b>12<small>DEC</small><em>2026</em></b><i></i><span>PUNE</span></div>
    <p class="tag rv" data-i="tagline"></p>
    <div class="cd rv"><div><b data-cd="days">000</b><small data-i="days"></small></div><div><b data-cd="hours">00</b><small data-i="hours"></small></div><div><b data-cd="minutes">00</b><small data-i="minutes"></small></div><div><b data-cd="seconds">00</b><small data-i="seconds"></small></div></div>
  </section>

  <!-- family -->
  <section class="card family">
    <p class="small rv" data-i="fam_h"></p>
    <div class="fam rv">
      <div><small data-i="fam_bride"></small><b data-i="fam_bride_n"></b></div><span>❀</span><div><small data-i="fam_groom"></small><b data-i="fam_groom_n"></b></div>

  <!-- story -->

    <div class="arch rv" data-hovervideo tabindex="0"><video muted loop playsinline preload="auto" src="media/dummy.mp4"></video><div class="v-ov"><span>▶</span><small data-i="hover"></small></div></div>
    <h2 class="h rv" data-i="story_h"></h2><p class="lead rv" data-i="story_p"></p>
  </section>

  <!-- celebrations -->
  <section class="card events">
    <h2 class="h rv" data-i="events_h"></h2>
    <article class="ev rv"><div class="dt"><b>11</b><small>DEC</small></div><div class="tx"><small data-i="day1"></small><h3 data-i="haldi_name"></h3><p class="when" data-i="haldi_date"></p><p data-i="haldi_time"></p><p class="venue" data-i="haldi_venue"></p><p class="addr" data-i="haldi_addr" data-html></p><p class="note" data-i="haldi_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Kothrud+Pune"><span data-i="directions"></span> ↗</a></div></article>
    <article class="ev rv"><div class="dt"><b>12</b><small>DEC</small></div><div class="tx"><small data-i="day2"></small><h3 data-i="wed_name"></h3><p class="when" data-i="wed_date"></p><p data-i="wed_time"></p><p class="venue" data-i="wed_venue"></p><p class="addr" data-i="wed_addr" data-html></p><p class="note" data-i="wed_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="directions"></span> ↗</a></div></article>
    <article class="ev rv"><div class="dt"><b>12</b><small data-i="evening"></small></div><div class="tx"><small data-i="evening"></small><h3 data-i="rec_name"></h3><p class="when" data-i="rec_date"></p><p data-i="rec_time"></p><p class="venue" data-i="rec_venue"></p><p class="addr" data-i="rec_addr" data-html></p><p class="note" data-i="rec_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="directions"></span> ↗</a></div></article>
    <div class="btns rv"><button class="soft" data-action="calendar" type="button">＋ <span data-i="calendar"></span></button></div>
  </section>

  <section class="card couple">
    <h2 class="h rv" data-i="couple_h"></h2>

      <figure class="pp rv" data-lightbox="c" data-img="media/bride.jpg" data-name="Shivani" data-role="bride_role" data-bio="bride_bio"><div class="ring"><img src="media/bride.jpg" alt="Shivani" loading="lazy" /></div><figcaption><b>Shivani</b><small data-i="bride_role"></small><p data-i="bride_bio"></p></figcaption></figure>
      <figure class="pp rv" data-lightbox="c" data-img="media/groom.jpg" data-name="Akash" data-role="groom_role" data-bio="groom_bio"><div class="ring"><img src="media/groom.jpg" alt="Akash" loading="lazy" /></div><figcaption><b>Akash</b><small data-i="groom_role"></small><p data-i="groom_bio"></p></figcaption></figure>
    </div>
  </section>

  <!-- moments -->
  <section class="card moments">
    <h2 class="h rv" data-i="gallery_h"></h2>
    <div class="mg">
      <figure class="rv" data-lightbox="c" data-img="media/bride.jpg" data-name="Shivani" data-role="bride_role" data-bio="bride_bio"><img src="media/bride.jpg" alt="" loading="lazy" /><figcaption data-i="m1"></figcaption></figure>

      <figure class="rv t2"><span>💍</span><figcaption data-i="m4"></figcaption></figure>
      <figure class="rv" data-lightbox="c" data-img="media/groom.jpg" data-name="Akash" data-role="groom_role" data-bio="groom_bio"><img src="media/groom.jpg" alt="" loading="lazy" /><figcaption data-i="m2"></figcaption></figure>

  <!-- venue -->
  <section class="card place">
    <h2 class="h rv" data-i="venue_h"></h2>
    <div class="map rv"><iframe title="Venue map" loading="lazy" src="https://maps.google.com/maps?q=Koregaon+Park+Pune&amp;output=embed"></iframe></div>
    <p class="venue-n rv" data-i="wed_venue"></p><p class="addr rv" data-i="wed_addr" data-html></p>
    <ul class="rv"><li>✈ <span data-i="airport"></span></li><li>🚆 <span data-i="train"></span></li><li>🚗 <span data-i="parking"></span></li></ul>

  <!-- rsvp -->
  <section class="card rsvp">
    <span class="bloom">❀</span>
    <p class="closing rv" data-i="closing"></p><h2 class="sig rv">Shivani <i>&amp;</i> Akash</h2><small class="foot" data-i="footer"></small>

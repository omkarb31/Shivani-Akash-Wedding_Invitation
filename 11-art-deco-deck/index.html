<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b0b0b" />
<title>Shivani &amp; Akash — Art Deco Gala</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Poiret+One&family=Josefin+Sans:wght@300;400;600&family=Tiro+Devanagari+Marathi&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared/core.css?v=8" />
<link rel="stylesheet" href="style.css?v=8" />
<script defer src="shared/content.js?v=8"></script>
<script defer src="shared/core.js?v=8"></script>
<script defer src="app.js?v=8"></script>
</head>
<body class="locked">

<!-- gate: golden elevator doors + floor dial -->
<div class="gate" data-gate>
  <div class="dial"><i class="needle"></i><span>G</span><span>1</span><span>2</span><span>3</span><span>★</span></div>
  <div class="door dl"></div><div class="door dr"></div>
  <div class="g-in">
    <p class="g-s" data-i="invited"></p>
    <h1 class="g-n">Shivani <i>&amp;</i> Akash</h1>
    <p class="g-s" data-i="date"></p>
    <button class="g-btn" data-open type="button"><span data-i="open"></span> ▲</button>
  </div>
</div>

<header class="top"><span class="mono">S ◆ A</span><button class="lang" data-lang-toggle type="button"><span data-lang-label></span></button></header>

<main>
  <!-- sunburst hero -->
  <section class="hero" id="home">
    <div class="burst" aria-hidden="true"></div>
    <div class="fan" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="h-in">
      <p class="small rv" data-i="blessings"></p>
      <h2 class="names rv">Shivani<span>◆</span>Akash</h2>
      <p class="tag rv" data-i="tagline"></p>
      <p class="ddate rv"><span data-i="date"></span> · <span data-i="city"></span></p>
    </div>
    <div class="steps" aria-hidden="true"><i></i><i></i><i></i></div>
  </section>

  <!-- countdown dials -->
  <section class="dials">
    <p class="small rv" data-i="countdown"></p>
    <div class="dl-row rv">
      <div class="dd"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44"/><circle class="arc" id="a-d" cx="50" cy="50" r="44"/></svg><b data-cd="days">000</b><small data-i="days"></small></div>
      <div class="dd"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44"/><circle class="arc" id="a-h" cx="50" cy="50" r="44"/></svg><b data-cd="hours">00</b><small data-i="hours"></small></div>
      <div class="dd"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44"/><circle class="arc" id="a-m" cx="50" cy="50" r="44"/></svg><b data-cd="minutes">00</b><small data-i="minutes"></small></div>
      <div class="dd"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44"/><circle class="arc" id="a-s" cx="50" cy="50" r="44"/></svg><b data-cd="seconds">00</b><small data-i="seconds"></small></div>
    </div>
    <p class="lead rv" data-i="intro"></p>
    <div class="btns rv"><button class="gold" data-action="calendar" type="button">＋ <span data-i="calendar"></span></button><button class="out" data-action="copy" type="button">⌖ <span data-i="copy"></span></button></div>
  </section>

  <!-- event card deck -->
  <section class="deck-sec" id="events">
    <h2 class="h rv" data-i="events_h"></h2>
    <div class="deck" id="deck">
      <article class="card" data-i0="0"><div class="cf"><span class="num">I</span><small data-i="day1"></small><h3 data-i="haldi_name"></h3><p class="when" data-i="haldi_date"></p><p data-i="haldi_time"></p><hr><p class="venue" data-i="haldi_venue"></p><p class="addr" data-i="haldi_addr" data-html></p><p class="note" data-i="haldi_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Kothrud+Pune"><span data-i="directions"></span> ↗</a></div></article>
      <article class="card" data-i0="1"><div class="cf"><span class="num">II</span><small data-i="day2"></small><h3 data-i="wed_name"></h3><p class="when" data-i="wed_date"></p><p data-i="wed_time"></p><hr><p class="venue" data-i="wed_venue"></p><p class="addr" data-i="wed_addr" data-html></p><p class="note" data-i="wed_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="directions"></span> ↗</a></div></article>
      <article class="card" data-i0="2"><div class="cf"><span class="num">III</span><small data-i="evening"></small><h3 data-i="rec_name"></h3><p class="when" data-i="rec_date"></p><p data-i="rec_time"></p><hr><p class="venue" data-i="rec_venue"></p><p class="addr" data-i="rec_addr" data-html></p><p class="note" data-i="rec_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="directions"></span> ↗</a></div></article>
    </div>
    <div class="deck-ctl"><button class="ctl" id="dprev" type="button" aria-label="Previous">◀</button><span id="dcount">1 / 3</span><button class="ctl" id="dnext" type="button" aria-label="Next">▶</button></div>
    <p class="swipe" data-i="details"></p>
  </section>

  <!-- couple -->
  <section class="couple" id="couple">
    <h2 class="h rv" data-i="couple_h"></h2>
    <div class="cp">
      <figure class="oct rv" data-lightbox="c" data-img="media/bride.jpg" data-name="Shivani" data-role="bride_role" data-bio="bride_bio"><div class="frame"><img src="media/bride.jpg" alt="Shivani" loading="lazy" /></div><figcaption><b>Shivani</b><small data-i="bride_role"></small></figcaption></figure>
      <div class="center-orn rv" aria-hidden="true"><i></i><i></i><i></i><b>◆</b></div>
      <figure class="oct rv" data-lightbox="c" data-img="media/groom.jpg" data-name="Akash" data-role="groom_role" data-bio="groom_bio"><div class="frame"><img src="media/groom.jpg" alt="Akash" loading="lazy" /></div><figcaption><b>Akash</b><small data-i="groom_role"></small></figcaption></figure>
    </div>
  </section>

  <!-- film -->
  <section class="film">
    <div class="arch-video rv" data-hovervideo tabindex="0"><video muted loop playsinline preload="auto" src="media/dummy.mp4"></video><div class="sb"></div><div class="v-ov"><span>▶</span><small data-i="hover"></small></div></div>
    <div class="ft rv"><p class="small" data-i="nav_story"></p><h2 class="h left" data-i="story_h"></h2><p class="lead" data-i="story_p"></p></div>
  </section>

  <!-- gallery -->
  <section class="gallery">
    <h2 class="h rv" data-i="gallery_h"></h2>
    <div class="gstrip">
      <figure class="gf" data-lightbox="c" data-img="media/bride.jpg" data-name="Shivani" data-role="bride_role" data-bio="bride_bio"><img src="media/bride.jpg" alt="" loading="lazy" /><figcaption data-i="m1"></figcaption></figure>
      <figure class="gf g1"><span>☕</span><figcaption data-i="m3"></figcaption></figure>
      <figure class="gf g2"><span>💍</span><figcaption data-i="m4"></figcaption></figure>
      <figure class="gf" data-lightbox="c" data-img="media/groom.jpg" data-name="Akash" data-role="groom_role" data-bio="groom_bio"><img src="media/groom.jpg" alt="" loading="lazy" /><figcaption data-i="m2"></figcaption></figure>
      <figure class="gf g3"><span>✈️</span><figcaption data-i="m5"></figcaption></figure>
      <figure class="gf g4"><span>💞</span><figcaption data-i="m6"></figcaption></figure>
    </div>
  </section>

  <!-- venue -->
  <section class="venue-sec" id="venue">
    <h2 class="h rv" data-i="venue_h"></h2>
    <div class="vg">
      <div class="omap rv"><iframe title="Venue map" loading="lazy" src="https://maps.google.com/maps?q=Koregaon+Park+Pune&amp;output=embed"></iframe></div>
      <div class="vtxt rv"><p class="venue" data-i="wed_venue"></p><p class="addr" data-i="wed_addr" data-html></p><ul><li>✈ <span data-i="airport"></span></li><li>🚆 <span data-i="train"></span></li><li>🚗 <span data-i="parking"></span></li></ul><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="openmap"></span> ↗</a></div>
    </div>
    <footer class="end rv"><div class="fan2" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><p data-i="closing"></p><h2>Shivani <i>◆</i> Akash</h2><small data-i="footer"></small></footer>
  </section>
</main>
<a class="back-hub" href="../index.html" data-i="back"></a>
</body>
</html>

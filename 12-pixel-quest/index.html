<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#5c94fc" />
<title>Shivani &amp; Akash — Pixel Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Tiro+Devanagari+Marathi&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared/core.css?v=8" />
<link rel="stylesheet" href="style.css?v=8" />
<script defer src="shared/content.js?v=8"></script>
<script defer src="shared/core.js?v=8"></script>
<script defer src="app.js?v=8"></script>
</head>
<body class="locked">

<!-- gate: title screen -->
<div class="gate" data-gate>
  <div class="clouds" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="g-in">
    <p class="g-s" data-i="invited"></p>
    <h1 class="g-n"><span>SHIVANI</span><b>♥</b><span>AKASH</span></h1>
    <p class="g-s">A LOVE STORY · <span data-i="date"></span></p>
    <button class="g-btn" data-open type="button"><span data-i="open"></span></button>
    <p class="g-s blink">▶ PRESS START ◀</p>
  </div>
  <div class="ground"></div>
</div>

<!-- HUD -->
<header class="hud">
  <div><small>PLAYER 1</small><b>SHIVANI</b></div>
  <div><small>LIVES</small><b class="hearts">♥♥♥</b></div>
  <div><small>WORLD</small><b>12-12</b></div>
  <div class="hud-t"><small data-i="days"></small><b data-cd="days">000</b></div>
  <button class="lang" data-lang-toggle type="button"><span data-lang-label></span></button>
</header>

<main>
  <!-- WORLD 1-1 -->
  <section class="world" id="home">
    <div class="sky"><div class="clouds big" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="hills" aria-hidden="true"></div></div>
    <div class="stage-in">
      <p class="lvl" data-i="kicker"></p>
      <h2 class="title rv"><span>SHIVANI</span><b>♥</b><span>AKASH</span></h2>
      <p class="rv tag" data-i="tagline"></p>
      <div class="runway rv" aria-hidden="true"><span class="sprite bride" id="sBride">👰</span><span class="sprite groom" id="sGroom">🤵</span><span class="castle">🏰</span></div>
      <p class="rv small" data-i="blessings"></p>
    </div>
    <div class="ground-strip"></div>
  </section>

  <!-- SCOREBOARD -->
  <section class="score" id="count">
    <p class="small rv" data-i="countdown"></p>
    <div class="board rv">
      <div class="cell"><i class="coin">●</i><b data-cd="days">000</b><small data-i="days"></small></div>
      <div class="cell"><i class="coin">●</i><b data-cd="hours">00</b><small data-i="hours"></small></div>
      <div class="cell"><i class="coin">●</i><b data-cd="minutes">00</b><small data-i="minutes"></small></div>
      <div class="cell"><i class="coin">●</i><b data-cd="seconds">00</b><small data-i="seconds"></small></div>
    </div>
    <p class="lead rv" data-i="intro"></p>
    <div class="btns rv"><button class="pbtn" data-action="calendar" type="button">＋ <span data-i="calendar"></span></button><button class="pbtn alt" data-action="copy" type="button">⌖ <span data-i="copy"></span></button></div>
  </section>

  <!-- LEVEL SELECT -->
  <section class="levels" id="events">
    <h2 class="h rv" data-i="events_h"></h2>
    <div class="map rv">
      <div class="path" aria-hidden="true"></div>
      <button class="node on" data-lv="0" type="button"><i>🌼</i><span>1-1</span></button>
      <button class="node" data-lv="1" type="button"><i>🏰</i><span>1-2</span></button>
      <button class="node" data-lv="2" type="button"><i>🪩</i><span>1-3</span></button>
    </div>
    <div class="dialogs">
      <article class="dialog on"><div class="npc">👰</div><div class="box"><small data-i="day1"></small><h3 data-i="haldi_name"></h3><p class="when" data-i="haldi_date"></p><p data-i="haldi_time"></p><p class="venue" data-i="haldi_venue"></p><p class="addr" data-i="haldi_addr" data-html></p><p class="note" data-i="haldi_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Kothrud+Pune"><span data-i="directions"></span> ▶</a></div></article>
      <article class="dialog"><div class="npc">🤵</div><div class="box"><small data-i="day2"></small><h3 data-i="wed_name"></h3><p class="when" data-i="wed_date"></p><p data-i="wed_time"></p><p class="venue" data-i="wed_venue"></p><p class="addr" data-i="wed_addr" data-html></p><p class="note" data-i="wed_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="directions"></span> ▶</a></div></article>
      <article class="dialog"><div class="npc">🕺</div><div class="box"><small data-i="evening"></small><h3 data-i="rec_name"></h3><p class="when" data-i="rec_date"></p><p data-i="rec_time"></p><p class="venue" data-i="rec_venue"></p><p class="addr" data-i="rec_addr" data-html></p><p class="note" data-i="rec_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="directions"></span> ▶</a></div></article>
    </div>
  </section>

  <!-- PLAYER SELECT -->
  <section class="select" id="couple">
    <h2 class="h rv" data-i="couple_h"></h2>
    <p class="small rv">CHOOSE YOUR PLAYER</p>
    <div class="players">
      <figure class="pl rv" data-lightbox="c" data-img="media/bride.jpg" data-name="Shivani" data-role="bride_role" data-bio="bride_bio"><div class="px"><canvas data-src="media/bride.jpg"></canvas></div><figcaption><b>P1 · SHIVANI</b><small data-i="bride_role"></small><div class="stats"><span>CHARM <i style="--v:100%"></i></span><span>HEART <i style="--v:100%"></i></span><span>DANCE <i style="--v:90%"></i></span></div></figcaption></figure>
      <span class="vs rv">VS?<br>♥</span>
      <figure class="pl rv" data-lightbox="c" data-img="media/groom.jpg" data-name="Akash" data-role="groom_role" data-bio="groom_bio"><div class="px"><canvas data-src="media/groom.jpg"></canvas></div><figcaption><b>P2 · AKASH</b><small data-i="groom_role"></small><div class="stats"><span>CHARM <i style="--v:98%"></i></span><span>HEART <i style="--v:100%"></i></span><span>DANCE <i style="--v:60%"></i></span></div></figcaption></figure>
    </div>
  </section>

  <!-- ARCADE -->
  <section class="arcade" id="story">
    <div class="cab rv" data-hovervideo tabindex="0">
      <div class="marq">★ LOVE STORY ★</div>
      <div class="screen"><video muted loop playsinline preload="auto" src="media/dummy.mp4"></video><div class="sc-ov"><b>INSERT COIN</b><small data-i="hover"></small></div></div>
      <div class="ctl"><i class="stick"></i><i class="btn b1"></i><i class="btn b2"></i></div>
    </div>
    <div class="rv at"><h2 class="h left" data-i="story_h"></h2><p class="lead" data-i="story_p"></p></div>
  </section>

  <!-- POWER-UPS -->
  <section class="powerups" id="moments">
    <h2 class="h rv" data-i="gallery_h"></h2>
    <div class="blocks">
      <figure class="blk" data-lightbox="c" data-img="media/bride.jpg" data-name="Shivani" data-role="bride_role" data-bio="bride_bio"><span class="q">?</span><div class="reveal"><canvas data-src="media/bride.jpg"></canvas></div><figcaption data-i="m1"></figcaption></figure>
      <figure class="blk"><span class="q">?</span><div class="reveal e1">☕</div><figcaption data-i="m3"></figcaption></figure>
      <figure class="blk"><span class="q">?</span><div class="reveal e2">💍</div><figcaption data-i="m4"></figcaption></figure>
      <figure class="blk" data-lightbox="c" data-img="media/groom.jpg" data-name="Akash" data-role="groom_role" data-bio="groom_bio"><span class="q">?</span><div class="reveal"><canvas data-src="media/groom.jpg"></canvas></div><figcaption data-i="m2"></figcaption></figure>
      <figure class="blk"><span class="q">?</span><div class="reveal e3">✈️</div><figcaption data-i="m5"></figcaption></figure>
      <figure class="blk"><span class="q">?</span><div class="reveal e4">💞</div><figcaption data-i="m6"></figcaption></figure>
    </div>
  </section>

  <!-- FINAL CASTLE -->
  <section class="castle-sec" id="venue">
    <h2 class="h rv" data-i="venue_h"></h2>
    <div class="cg">
      <div class="pmap rv"><iframe title="Venue map" loading="lazy" src="https://maps.google.com/maps?q=Koregaon+Park+Pune&amp;output=embed"></iframe></div>
      <div class="ctxt rv"><p class="venue" data-i="wed_venue"></p><p class="addr" data-i="wed_addr" data-html></p><ul><li>✈ <span data-i="airport"></span></li><li>🚆 <span data-i="train"></span></li><li>🚗 <span data-i="parking"></span></li></ul><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="openmap"></span> ▶</a></div>
    </div>
    <footer class="win rv"><p class="youwin">YOU WIN!</p><p data-i="closing"></p><h2>SHIVANI ♥ AKASH</h2><button class="pbtn" id="again" type="button">▶ PLAY AGAIN</button><small data-i="footer"></small></footer>
  </section>
</main>
<a class="back-hub" href="../index.html" data-i="back"></a>
</body>
</html>

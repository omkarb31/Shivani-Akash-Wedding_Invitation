<!doctype html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#7a1a4f" />
<meta name="description" content="शिवानी आणि आकाश यांच्या शुभविवाहाचे आपणास आग्रहाचे निमंत्रण. १२ डिसेंबर २०२६, पुणे." />
<meta property="og:title" content="शिवानी आणि आकाश — शुभविवाह निमंत्रण" />
<meta property="og:description" content="आपणास सहकुटुंब सप्रेम निमंत्रण. १२ डिसेंबर २०२६, पुणे." />
<meta property="og:image" content="https://omkarb31.github.io/Shivani-Akash-Wedding_Invitation/14-paithani-tradition/media/bride.jpg" />
<title>शिवानी &amp; आकाश — शुभविवाह</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Tiro+Devanagari+Marathi:ital@0;1&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared/core.css?v=9" />
<link rel="stylesheet" href="style.css?v=9" />
<script>window.DEFAULT_LANG = "mr";</script>
<script defer src="shared/content.js?v=9"></script>
<script defer src="shared/core.js?v=9"></script>
<script defer src="app.js?v=9"></script>
</head>
<body class="locked">

<!-- gate: tarun / stage curtains with zari border -->
<div class="gate" data-gate>
  <div class="cur cl"></div><div class="cur cr"></div>
  <div class="g-in">
    <span class="om">ॐ</span>
    <p class="gan" data-i="ganesh"></p>
    <p class="g-s" data-i="warm"></p>
    <h1 class="g-n">Shivani <i>&amp;</i> Akash</h1>
    <p class="g-s" data-i="date"></p>
    <button class="g-btn" data-open type="button"><span data-i="open"></span></button>
  </div>
</div>

<!-- fixed zari border + mundavalya (pearl strings) -->
<div class="zari top-z" aria-hidden="true"></div><div class="zari bot-z" aria-hidden="true"></div>
<div class="munda" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<header class="top"><span class="mono">शि ❁ आ</span><button class="lang" data-lang-toggle type="button"><span data-lang-label></span></button></header>
<button class="fab" data-action="share" type="button" aria-label="Share"><span>↗</span></button>

<main>
  <!-- invitation card -->
  <section class="sec hero">
    <span class="om big rv">ॐ</span>
    <p class="gan rv" data-i="ganesh"></p>
    <p class="warm rv" data-i="warm"></p>
    <h1 class="names rv"><span>Shivani</span><em>❁</em><span>Akash</span></h1>
    <p class="tag rv" data-i="tagline"></p>
    <div class="ddate rv"><div><small data-i="dd_day"></small><b data-i="dd_month"></b></div><i></i><div><small data-i="dd_year"></small><b data-i="city"></b></div></div>
    <div class="cd rv"><div><b data-cd="days">000</b><small data-i="days"></small></div><div><b data-cd="hours">00</b><small data-i="hours"></small></div><div><b data-cd="minutes">00</b><small data-i="minutes"></small></div><div><b data-cd="seconds">00</b><small data-i="seconds"></small></div></div>
  </section>

  <!-- family -->
  <section class="sec family">
    <div class="frame rv">
      <p class="small" data-i="fam_h"></p>
      <div class="fam"><div><small data-i="fam_bride"></small><b data-i="fam_bride_n"></b></div><span>❁</span><div><small data-i="fam_groom"></small><b data-i="fam_groom_n"></b></div></div>
      <p class="lead" data-i="intro"></p>
    </div>
  </section>

  <!-- ceremonies -->
  <section class="sec events">
    <h2 class="h rv" data-i="events_h"></h2>
    <div class="vidhi">
      <article class="zf rv"><span class="lotus">❁</span><small data-i="day1"></small><h3 data-i="haldi_name"></h3><p class="when" data-i="haldi_date"></p><p data-i="haldi_time"></p><hr><p class="venue" data-i="haldi_venue"></p><p class="addr" data-i="haldi_addr" data-html></p><p class="note" data-i="haldi_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Kothrud+Pune"><span data-i="directions"></span> ↗</a></article>
      <article class="zf rv"><span class="lotus">ॐ</span><small data-i="day2"></small><h3 data-i="wed_name"></h3><p class="when" data-i="wed_date"></p><p data-i="wed_time"></p><hr><p class="venue" data-i="wed_venue"></p><p class="addr" data-i="wed_addr" data-html></p><p class="note" data-i="wed_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="directions"></span> ↗</a></article>
      <article class="zf rv"><span class="lotus">✺</span><small data-i="evening"></small><h3 data-i="rec_name"></h3><p class="when" data-i="rec_date"></p><p data-i="rec_time"></p><hr><p class="venue" data-i="rec_venue"></p><p class="addr" data-i="rec_addr" data-html></p><p class="note" data-i="rec_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="directions"></span> ↗</a></article>
    </div>
    <div class="btns rv"><button class="gold" data-action="calendar" type="button">＋ <span data-i="calendar"></span></button></div>
  </section>

  <!-- couple -->
  <section class="sec couple">
    <h2 class="h rv" data-i="couple_h"></h2>
    <div class="duo">
      <figure class="pp rv" data-lightbox="c" data-img="media/bride.jpg" data-name="Shivani" data-role="bride_role" data-bio="bride_bio"><div class="oval"><img src="media/bride.jpg" alt="Shivani" loading="lazy" /></div><figcaption><b>Shivani</b><small data-i="bride_role"></small><p data-i="bride_bio"></p></figcaption></figure>
      <figure class="pp rv" data-lightbox="c" data-img="media/groom.jpg" data-name="Akash" data-role="groom_role" data-bio="groom_bio"><div class="oval"><img src="media/groom.jpg" alt="Akash" loading="lazy" /></div><figcaption><b>Akash</b><small data-i="groom_role"></small><p data-i="groom_bio"></p></figcaption></figure>
    </div>
  </section>

  <!-- story -->
  <section class="sec story">
    <div class="tv rv" data-hovervideo tabindex="0"><video muted loop playsinline preload="auto" src="media/dummy.mp4"></video><div class="v-ov"><span>▶</span><small data-i="tap"></small></div></div>
    <h2 class="h rv" data-i="story_h"></h2><p class="lead rv" data-i="story_p"></p>
  </section>

  <!-- venue -->
  <section class="sec place">
    <h2 class="h rv" data-i="venue_h"></h2>
    <div class="map rv"><iframe title="Venue map" loading="lazy" src="https://maps.google.com/maps?q=Koregaon+Park+Pune&amp;output=embed"></iframe></div>
    <p class="venue-n rv" data-i="wed_venue"></p><p class="addr rv" data-i="wed_addr" data-html></p>
    <ul class="rv"><li>✈ <span data-i="airport"></span></li><li>🚆 <span data-i="train"></span></li><li>🚗 <span data-i="parking"></span></li></ul>
    <div class="btns rv"><a class="gold" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="openmap"></span> ↗</a><button class="out" data-action="copy" type="button">⌖ <span data-i="copy"></span></button></div>
  </section>

  <!-- rsvp / closing -->
  <section class="sec rsvp">
    <span class="om big rv">ॐ</span>
    <p class="closing rv" data-i="withlove"></p><h2 class="sig rv">Shivani <i>❁</i> Akash</h2><small class="foot" data-i="footer"></small>
  </section>
</main>
<a class="back-hub" href="../index.html" data-i="back"></a>
</body>
</html>

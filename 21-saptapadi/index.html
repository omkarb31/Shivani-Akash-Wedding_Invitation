<body class="locked">
<div class="mandala" aria-hidden="true"></div>

<div class="gate" data-gate>
  <div class="g-in">
    <span class="om">ॐ</span>
    <p class="g-s" data-i="ganesh"></p>
    <h1 class="g-n">Shivani <span>❁</span> Akash</h1>
    <p class="g-s" data-i="sp_walk"></p>
    <button class="g-btn" data-open type="button"><span data-i="open"></span></button>
  </div>
</div>

<header class="top"><span class="mono">शि ❁ आ</span><button class="lang" data-lang-toggle type="button"><span data-lang-label></span></button></header>
<button class="fab" data-action="share" type="button" aria-label="Share"><span>↗</span></button>

<main>
  <section class="hero">
    <span class="om big rv">ॐ</span>
    <p class="gan rv" data-i="ganesh"></p>
    <p class="warm rv" data-i="together"></p>
    <h1 class="names rv"><span>Shivani</span><em>❁</em><span>Akash</span></h1>
    <p class="tag rv" data-i="sp_tag"></p>
    <div class="cd rv"><div><b data-cd="days">000</b><small data-i="days"></small></div><div><b data-cd="hours">00</b><small data-i="hours"></small></div><div><b data-cd="minutes">00</b><small data-i="minutes"></small></div><div><b data-cd="seconds">00</b><small data-i="seconds"></small></div></div>
  </section>

  <section class="sec">
    <p class="small rv" data-i="fam_h"></p>
    <div class="fam rv"><div><small data-i="fam_bride"></small><b data-i="fam_bride_n"></b></div><span>🪔</span><div><small data-i="fam_groom"></small><b data-i="fam_groom_n"></b></div></div>
    <p class="lead rv" data-i="intro"></p>
  </section>

  <!-- the seven steps -->
  <section class="steps" id="steps">
    <h2 class="h rv" data-i="sp_h"></h2>
    <p class="lead rv" data-i="sp_p"></p>
    <div class="path">
      <div class="trail" aria-hidden="true"><i class="tl"></i><i class="tf" id="tf"></i></div>
      <article class="step rv left" data-s="1"><span class="diya"><i class="fl"></i><i class="bw"></i></span><div class="scard"><b class="n">१</b><h3 data-i="s1_t"></h3><p data-i="s1_p"></p></div></article>
      <article class="step rv right" data-s="2"><span class="diya"><i class="fl"></i><i class="bw"></i></span><div class="scard"><b class="n">२</b><h3 data-i="s2_t"></h3><p data-i="s2_p"></p></div></article>
      <article class="step rv left" data-s="3"><span class="diya"><i class="fl"></i><i class="bw"></i></span><div class="scard"><b class="n">३</b><h3 data-i="s3_t"></h3><p data-i="s3_p"></p></div></article>
      <article class="step rv right" data-s="4"><span class="diya"><i class="fl"></i><i class="bw"></i></span><div class="scard"><b class="n">४</b><h3 data-i="s4_t"></h3><p data-i="s4_p"></p></div></article>
      <article class="step rv left" data-s="5"><span class="diya"><i class="fl"></i><i class="bw"></i></span><div class="scard"><b class="n">५</b><h3 data-i="s5_t"></h3><p data-i="s5_p"></p></div></article>
      <article class="step rv right" data-s="6"><span class="diya"><i class="fl"></i><i class="bw"></i></span><div class="scard"><b class="n">६</b><h3 data-i="s6_t"></h3><p data-i="s6_p"></p></div></article>
      <article class="step rv left" data-s="7"><span class="diya"><i class="fl"></i><i class="bw"></i></span><div class="scard"><b class="n">७</b><h3 data-i="s7_t"></h3><p data-i="s7_p"></p></div></article>
    </div>
    <p class="litc"><b id="litN">0</b> / 7 <span data-i="sp_lit"></span></p>
  </section>

  <!-- events -->
  <section class="sec events" id="events">
    <h2 class="h rv" data-i="events_h"></h2>
    <div class="cards">
      <article class="zf rv"><small data-i="day1"></small><h3 data-i="haldi_name"></h3><p class="when" data-i="haldi_date"></p><p data-i="haldi_time"></p><hr><p class="venue" data-i="haldi_venue"></p><p class="addr" data-i="haldi_addr" data-html></p><p class="note" data-i="haldi_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Kothrud+Pune"><span data-i="directions"></span> ↗</a></article>
      <article class="zf rv"><small data-i="day2"></small><h3 data-i="wed_name"></h3><p class="when" data-i="wed_date"></p><p data-i="wed_time"></p><hr><p class="venue" data-i="wed_venue"></p><p class="addr" data-i="wed_addr" data-html></p><p class="note" data-i="wed_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="directions"></span> ↗</a></article>
      <article class="zf rv"><small data-i="evening"></small><h3 data-i="rec_name"></h3><p class="when" data-i="rec_date"></p><p data-i="rec_time"></p><hr><p class="venue" data-i="rec_venue"></p><p class="addr" data-i="rec_addr" data-html></p><p class="note" data-i="rec_note"></p><a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="directions"></span> ↗</a></article>
    </div>
    <div class="btns rv"><button class="gold" data-action="calendar" type="button">＋ <span data-i="calendar"></span></button></div>
  </section>

  <section class="sec couple">
    <h2 class="h rv" data-i="couple_h"></h2>
    <div class="duo">
      <figure class="pp rv" data-lightbox="c" data-img="media/bride.jpg" data-name="Shivani" data-role="bride_role" data-bio="bride_bio"><div class="oval"><img src="media/bride.jpg" alt="Shivani" loading="lazy" /></div><figcaption><b>Shivani</b><small data-i="bride_role"></small><p data-i="bride_bio"></p></figcaption></figure>
      <figure class="pp rv" data-lightbox="c" data-img="media/groom.jpg" data-name="Akash" data-role="groom_role" data-bio="groom_bio"><div class="oval"><img src="media/groom.jpg" alt="Akash" loading="lazy" /></div><figcaption><b>Akash</b><small data-i="groom_role"></small><p data-i="groom_bio"></p></figcaption></figure>
    </div>
  </section>

  <section class="sec story">
    <div class="film rv" data-hovervideo tabindex="0"><video muted loop playsinline preload="auto" src="media/dummy.mp4"></video><div class="v-ov"><span>▶</span><small data-i="tap"></small></div></div>
    <h2 class="h rv" data-i="story_h"></h2><p class="lead rv" data-i="story_p"></p>
  </section>

  <section class="sec place" id="venue">
    <h2 class="h rv" data-i="venue_h"></h2>
    <div class="map rv"><iframe title="Venue map" loading="lazy" src="https://maps.google.com/maps?q=Koregaon+Park+Pune&amp;output=embed"></iframe></div>
    <p class="venue-n rv" data-i="wed_venue"></p><p class="addr rv" data-i="wed_addr" data-html></p>
    <ul class="rv"><li>✈ <span data-i="airport"></span></li><li>🚆 <span data-i="train"></span></li><li>🚗 <span data-i="parking"></span></li></ul>
    <div class="btns rv"><a class="gold" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="openmap"></span> ↗</a><button class="out" data-action="copy" type="button">⌖ <span data-i="copy"></span></button></div>
  </section>

  <footer class="end">
    <span class="om big">ॐ</span><p data-i="sp_end"></p><h2 class="sig">Shivani <i>❁</i> Akash</h2><small data-i="footer"></small>
  </footer>
</main>

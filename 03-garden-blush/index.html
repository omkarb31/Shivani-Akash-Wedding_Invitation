<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#fdf2f1" />
<title>Shivani &amp; Akash — Garden Blush</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Jost:wght@400;500;600&family=Tiro+Devanagari+Marathi&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared/core.css?v=7" />
<link rel="stylesheet" href="style.css?v=7" />
<script defer src="shared/content.js?v=7"></script>
<script defer src="shared/core.js?v=7"></script>
<script defer src="app.js?v=7"></script>
</head>
<body class="locked">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><clipPath id="heart" clipPathUnits="objectBoundingBox"><path d="M0.5,0.96 C0.08,0.66 0,0.42 0,0.28 C0,0.1 0.14,0 0.29,0 C0.39,0 0.47,0.06 0.5,0.15 C0.53,0.06 0.61,0 0.71,0 C0.86,0 1,0.1 1,0.28 C1,0.42 0.92,0.66 0.5,0.96Z"/></clipPath></defs></svg>

<!-- envelope gate -->
<div class="gate" data-gate>
  <div class="env">
    <div class="letter"><span data-i="kicker"></span><b>Shivani &amp; Akash</b><small data-i="date"></small></div>
    <div class="env-back"></div>
    <div class="env-front"></div>
    <div class="flap"></div>
    <button class="seal" data-open type="button" aria-label="Open invitation">❀</button>
  </div>
  <p class="gate-hint"><span data-i="invited"></span><br><b data-i="open"></b></p>
  <i class="blob b1"></i><i class="blob b2"></i>
</div>

<nav class="pill" aria-label="Sections">
  <a href="#home" data-i="nav_home"></a><a href="#events" data-i="nav_events"></a><a href="#couple" data-i="nav_couple"></a><a href="#story" data-i="nav_story"></a><a href="#moments" data-i="nav_gallery"></a><a href="#venue" data-i="nav_venue"></a>
  <button class="lang" data-lang-toggle type="button"><span data-lang-label></span></button>
</nav>

<main>
  <!-- hero collage -->
  <section class="hero" id="home">
    <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
    <div class="hero-copy">
      <p class="small rv" data-i="blessings"></p>
      <h1 class="script rv">Shivani<br><span>&amp;</span> Akash</h1>
      <p class="tag rv" data-i="tagline"></p>
      <p class="lead rv" data-i="intro"></p>
      <a class="cta rv" href="#events"><span data-i="savedate"></span> ↓</a>
    </div>
    <div class="collage">
      <div class="wreath" aria-hidden="true"><i>🌸</i><i>🌿</i><i>🌷</i><i>🍃</i><i>🌼</i><i>🌿</i><i>🌸</i><i>🍃</i></div>
      <div class="photo p-bride" data-lightbox="c" data-img="media/bride.jpg" data-name="Shivani" data-role="bride_role" data-bio="bride_bio"><img src="media/bride.jpg" alt="Shivani" /></div>
      <div class="photo p-groom" data-lightbox="c" data-img="media/groom.jpg" data-name="Akash" data-role="groom_role" data-bio="groom_bio"><img src="media/groom.jpg" alt="Akash" /></div>
      <span class="date-badge"><b>12</b><small>DEC</small><em>2026</em></span>
      <i class="bloom k1">🌸</i><i class="bloom k2">🌼</i><i class="bloom k3">🌷</i><i class="bloom k4">🌸</i>
    </div>
  </section>

  <!-- countdown flowers -->
  <section class="count">
    <p class="small rv" data-i="countdown"></p>
    <div class="flowers rv">
      <div class="fl"><span>🌸</span><b data-cd="days">000</b><small data-i="days"></small></div>
      <div class="fl"><span>🌼</span><b data-cd="hours">00</b><small data-i="hours"></small></div>
      <div class="fl"><span>🌷</span><b data-cd="minutes">00</b><small data-i="minutes"></small></div>
      <div class="fl"><span>🌺</span><b data-cd="seconds">00</b><small data-i="seconds"></small></div>
    </div>
  </section>

  <!-- winding timeline -->
  <section class="timeline" id="events">
    <h2 class="h rv" data-i="events_h"></h2>
    <div class="vine" aria-hidden="true"></div>
    <article class="tl left rv">
      <span class="node">🌼</span>
      <div class="tl-card"><span class="chip"><b>11</b> DEC</span><h3 data-i="haldi_name"></h3><p class="when" data-i="haldi_date"></p><p data-i="haldi_time"></p>
        <hr><p class="venue" data-i="haldi_venue"></p><p class="addr" data-i="haldi_addr" data-html></p><p class="note" data-i="haldi_note"></p>
        <a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Kothrud+Pune"><span data-i="directions"></span> ↗</a></div>
    </article>
    <article class="tl right rv">
      <span class="node">💍</span>
      <div class="tl-card"><span class="chip"><b>12</b> DEC</span><h3 data-i="wed_name"></h3><p class="when" data-i="wed_date"></p><p data-i="wed_time"></p>
        <hr><p class="venue" data-i="wed_venue"></p><p class="addr" data-i="wed_addr" data-html></p><p class="note" data-i="wed_note"></p>
        <a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="directions"></span> ↗</a></div>
    </article>
    <article class="tl left rv">
      <span class="node">🥂</span>
      <div class="tl-card"><span class="chip"><b>12</b> DEC</span><h3 data-i="rec_name"></h3><p class="when" data-i="rec_date"></p><p data-i="rec_time"></p>
        <hr><p class="venue" data-i="rec_venue"></p><p class="addr" data-i="rec_addr" data-html></p><p class="note" data-i="rec_note"></p>
        <a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="directions"></span> ↗</a></div>
    </article>
    <div class="btns rv"><button class="soft" data-action="calendar" type="button">＋ <span data-i="calendar"></span></button><button class="soft" data-action="copy" type="button">⌖ <span data-i="copy"></span></button></div>
  </section>

  <!-- letters from the couple -->
  <section class="letters" id="couple">
    <h2 class="h rv" data-i="couple_h"></h2>
    <div class="lt-grid">
      <article class="letter-card rv" style="--r:-2deg"><i class="tape"></i><img src="media/bride.jpg" alt="Shivani" loading="lazy" /><h3 class="script">Shivani</h3><small data-i="bride_role"></small><p data-i="bride_bio"></p></article>
      <article class="letter-card rv" style="--r:2deg"><i class="tape"></i><img src="media/groom.jpg" alt="Akash" loading="lazy" /><h3 class="script">Akash</h3><small data-i="groom_role"></small><p data-i="groom_bio"></p></article>
    </div>
  </section>

  <!-- heart video -->
  <section class="story" id="story">
    <div class="story-copy rv"><p class="small" data-i="nav_story"></p><h2 class="h left" data-i="story_h"></h2><p class="lead" data-i="story_p"></p></div>
    <div class="heart-wrap rv">
      <div class="heart-bg"></div>
      <div class="heart-win" data-hovervideo tabindex="0">
        <video muted loop playsinline preload="auto" src="media/dummy.mp4"></video>
        <div class="heart-ov"><span class="play">▶</span><small data-i="hover"></small></div>
      </div>
    </div>
  </section>

  <!-- polaroids -->
  <section class="moments" id="moments">
    <h2 class="h rv" data-i="gallery_h"></h2>
    <div class="polas">
      <figure class="pola rv" style="--r:-4deg" data-lightbox="c" data-img="media/bride.jpg" data-name="Shivani" data-role="bride_role" data-bio="bride_bio"><img src="media/bride.jpg" alt="" loading="lazy" /><figcaption data-i="m1"></figcaption></figure>
      <figure class="pola rv" style="--r:3deg"><div class="art a1">☕</div><figcaption data-i="m3"></figcaption></figure>
      <figure class="pola rv" style="--r:-2deg" data-lightbox="c" data-img="media/groom.jpg" data-name="Akash" data-role="groom_role" data-bio="groom_bio"><img src="media/groom.jpg" alt="" loading="lazy" /><figcaption data-i="m2"></figcaption></figure>
      <figure class="pola rv" style="--r:4deg"><div class="art a2">💍</div><figcaption data-i="m4"></figcaption></figure>
      <figure class="pola rv" style="--r:-3deg"><div class="art a3">✈️</div><figcaption data-i="m5"></figcaption></figure>
      <figure class="pola rv" style="--r:2deg"><div class="art a4">💞</div><figcaption data-i="m6"></figcaption></figure>
    </div>
  </section>

  <!-- venue as a postcard -->
  <section class="venue" id="venue">
    <h2 class="h rv" data-i="venue_h"></h2>
    <div class="postcard rv">
      <div class="pc-map"><iframe title="Venue map" loading="lazy" src="https://maps.google.com/maps?q=Koregaon+Park+Pune&amp;output=embed"></iframe></div>
      <div class="pc-text"><span class="stamp">🌸<small>PUNE</small></span><p class="venue" data-i="wed_venue"></p><p class="addr" data-i="wed_addr" data-html></p>
        <ul><li>✈ <span data-i="airport"></span></li><li>🚆 <span data-i="train"></span></li><li>🚗 <span data-i="parking"></span></li></ul>
        <a class="link" target="_blank" rel="noreferrer" href="https://maps.google.com/?q=Koregaon+Park+Pune"><span data-i="openmap"></span> ↗</a></div>
    </div>
  </section>

  <footer class="end">
    <span class="rv">🌸</span><p class="rv" data-i="closing"></p><h2 class="script rv">Shivani &amp; Akash</h2><small data-i="footer"></small>
  </footer>
</main>
<a class="back-hub" href="../index.html" data-i="back"></a>
</body>
</html>
